name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build EXE
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name MyCraftLauncher
          --collect-all customtkinter --collect-all minecraft_launcher_lib
          main.py
      - name: Portable ZIP
        run: Compress-Archive -Path dist\MyCraftLauncher\* -DestinationPath MyCraftLauncher_Portable.zip
        shell: pwsh
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: MyCraftLauncher
          path: |
            installer_output/MyCraftLauncher_Setup.exe
            MyCraftLauncher_Portable.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output/MyCraftLauncher_Setup.exe
            MyCraftLauncher_Portable.zip
